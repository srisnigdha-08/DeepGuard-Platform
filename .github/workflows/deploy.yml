name: CI/CD — DeepGuard Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Type "DEPLOY" to confirm manual production deployment'
        required: true
        default: 'NO'

# Cancel in-progress runs on new pushes to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────
  # JOB 1 — Test Node.js backend
  # ─────────────────────────────────────────────────────────
  test-backend:
    name: Test Node.js Backend
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Run tests
        working-directory: server
        env:
          NODE_ENV:           test
          TEST_MONGODB_URI:   mongodb://127.0.0.1:27017/deepfake_test
          MONGODB_URI:        mongodb://127.0.0.1:27017/deepfake_test
          JWT_ACCESS_SECRET:  test-access-secret-must-be-at-least-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-different-from-access
          AI_SERVICE_URL:     http://localhost:8000
          AI_SERVICE_KEY:     test-service-key-must-be-at-least-32-chars-long
          PORT:               5000
        run: npm test -- --coverage --forceExit

  # ─────────────────────────────────────────────────────────
  # JOB 2 — Build React frontend
  # ─────────────────────────────────────────────────────────
  build-frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build production bundle
        working-directory: client
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Check bundle sizes
        working-directory: client
        run: |
          LIMIT=524288  # 512KB per chunk
          for f in dist/assets/*.js; do
            size=$(wc -c < "$f")
            if [ "$size" -gt "$LIMIT" ]; then
              echo "❌ Bundle too large: $f (${size} bytes)"
              exit 1
            fi
          done
          echo "✅ All bundles within size limits"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name:            frontend-dist
          path:            client/dist
          retention-days: 3

  # ─────────────────────────────────────────────────────────
  # JOB 3 — Security audit
  # ─────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with: { node-version: "18" }

      - name: Audit backend dependencies
        working-directory: server
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Audit frontend dependencies
        working-directory: client
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────
  # JOB 4 — Deploy frontend to Vercel
  # Requires explicit manual trigger via workflow_dispatch with DEPLOY confirmation
  # ─────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy → Vercel
    needs: [test-backend, build-frontend, security-audit]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_deploy == 'DEPLOY'
    environment: production
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "18" }

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        working-directory: client
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel --prod --yes --token=$VERCEL_TOKEN \
            -e VITE_API_URL=${{ secrets.VITE_API_URL }}

  # ─────────────────────────────────────────────────────────
  # JOB 5 — Deploy backend to Render
  # Requires explicit manual trigger via workflow_dispatch with DEPLOY confirmation
  # ─────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy → Render
    needs: [test-backend, security-audit]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_deploy == 'DEPLOY'
    environment: production
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy
        run: |
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}")
          echo "Render deploy hook status: $STATUS"
          if [[ "$STATUS" != "200" && "$STATUS" != "201" ]]; then
            echo "❌ Render deploy hook failed (HTTP $STATUS)"
            exit 1
          fi
          echo "✅ Render deployment triggered"

  # ─────────────────────────────────────────────────────────
  # JOB 6 — Post-deploy health check
  # Only executes following successful manual deployment
  # ─────────────────────────────────────────────────────────
  health-check:
    name: Post-Deploy Health Check
    needs: [deploy-frontend, deploy-backend]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_deploy == 'DEPLOY'
    runs-on: ubuntu-latest

    steps:
      - name: Wait for Render to finish deploying
        run: |
          echo "Waiting 90s for Render deployment to complete…"
          sleep 90

      - name: Check backend health
        run: |
          URL="${{ secrets.API_URL }}/api/health"
          for i in {1..5}; do
            HTTP=$(curl -sf -o /dev/null -w "%{http_code}" "$URL" 2>/dev/null || echo "000")
            if [[ "$HTTP" == "200" ]]; then
              echo "✅ Backend healthy (HTTP $HTTP)"
              exit 0
            fi
            echo "Attempt $i: HTTP $HTTP — retrying in 15s…"
            sleep 15
          done
          echo "❌ Backend health check failed after 5 attempts"
          exit 1

      - name: Check frontend accessibility
        run: |
          HTTP=$(curl -sf -o /dev/null -w "%{http_code}" "${{ secrets.FRONTEND_URL }}" || echo "000")
          if [[ "$HTTP" == "200" ]]; then
            echo "✅ Frontend accessible (HTTP $HTTP)"
          else
            echo "❌ Frontend returned HTTP $HTTP"
            exit 1
          fi

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: "🚨 Deployment health check failed",
              body:  "Commit " + context.sha.slice(0,7) + " deployed but health check failed. Check Render/Vercel logs.",
              labels: ["deployment", "bug"],
            })
