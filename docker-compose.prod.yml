services:
  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 1G }

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:  ["80:80"]
    depends_on: [server]
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 128M }

  server:
    build:
      context: ./server
    ports:  ["5000:5000"]
    env_file: ["./server/.env.production"]
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    depends_on:
      - mongodb
      - ai-service
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 512M }

  ai-service:
    build:
      context: ./ai-service
    ports: ["8000:8000"]
    env_file: ["./ai-service/.env.production"]
    volumes:
      - ./ai-service/models:/app/models:ro
      - uploads_data:/app/shared_uploads
    restart: unless-stopped
    healthcheck:
      test:         ["CMD","curl","-f","http://localhost:8000/health"]
      interval:     30s
      timeout:      15s
      retries:      5
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver:       nvidia
              count:        1
              capabilities: [gpu]
        limits: { memory: 4G }

volumes:
  uploads_data:
  logs_data:
  mongo_data:
