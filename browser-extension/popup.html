<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>DeepGuard</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{width:320px;background:#0f1117;color:#f1f5f9;font-family:Inter,sans-serif;font-size:13px;}
    .header{padding:14px 16px;border-bottom:1px solid #2d3348;display:flex;align-items:center;gap:10px;}
    .logo{width:32px;height:32px;background:#6366f1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;color:white;font-size:15px;flex-shrink:0;}
    .title{font-weight:700;font-size:15px;color:#f1f5f9;}
    .subtitle{font-size:11px;color:#64748b;margin-top:1px;}
    .body{padding:14px 16px;}
    .result{background:#1a1d27;border:1px solid #2d3348;border-radius:10px;padding:14px;margin-bottom:12px;}
    .verdict{font-size:20px;font-weight:800;}
    .fake{color:#ef4444;} .real{color:#22c55e;}
    .conf{color:#94a3b8;font-size:12px;margin-top:4px;}
    .file{color:#64748b;font-size:11px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .empty{text-align:center;color:#64748b;padding:20px 0;line-height:1.8;font-size:12px;}
    .section-title{font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
    .input{width:100%;background:#1a1d27;border:1px solid #2d3348;border-radius:6px;padding:8px 10px;color:#f1f5f9;font-size:12px;outline:none;}
    .input:focus{border-color:#6366f1;}
    .btn{width:100%;padding:9px;border:none;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;margin-top:6px;}
    .btn-primary{background:#6366f1;color:white;}
    .btn-primary:hover{background:#4f46e5;}
    .btn-ghost{background:#1a1d27;border:1px solid #2d3348;color:#94a3b8;}
    .btn-ghost:hover{background:#252a3a;}
    .token-section{border-top:1px solid #2d3348;padding-top:12px;margin-top:12px;}
    .status{font-size:11px;color:#64748b;text-align:center;margin-top:10px;min-height:16px;}
    .hint{font-size:11px;color:#64748b;line-height:1.6;margin-top:8px;}
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">DG</div>
    <div>
      <div class="title">DeepGuard</div>
      <div class="subtitle">AI DeepFake Detector</div>
    </div>
  </div>
  <div class="body">
    <div id="result-container"></div>

    <div class="token-section">
      <div class="section-title">Authentication</div>
      <input type="password" id="token-input" class="input" placeholder="Paste JWT access token from DeepGuard…" />
      <button class="btn btn-primary" id="save-btn">Save Token</button>
      <p class="hint">Get your token from deepguard.vercel.app → Login → copy from browser dev tools (localStorage → accessToken).</p>
    </div>

    <div class="status" id="status-msg">Right-click any image → "Analyze with DeepGuard"</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
